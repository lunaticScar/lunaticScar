name: Generate Contribution Snake Animation

on:
  # Automatically runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows you to manually trigger the animation from the Actions tab
  workflow_dispatch:
  
  # Runs on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Downloads the repository content
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Generates the snake SVGs based on your GitHub contribution grid
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Pushes the generated SVG files to a separate branch called 'output'
      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
